name: Publish Package to npmjs
on:
  release:
    types: [created]
jobs:
  publish-npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      # No `registry-url`: it writes an .npmrc that reads `NODE_AUTH_TOKEN`,
      # which yarn v1 rejects while the variable is unset, and trusted
      # publishing needs no token.
      - uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          package-manager-cache: false
      - run: yarn
      - run: yarn build
      - run: yarn test
      # Trusted publishing: npm authenticates with the OIDC token that
      # `id-token: write` grants and adds the provenance statement itself.
      - run: npm publish
