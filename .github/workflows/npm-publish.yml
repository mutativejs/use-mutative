name: Publish Package to npmjs
on:
  release:
    types: [created]
jobs:
  publish-npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - run: yarn
      - run: yarn build
      - run: yarn test
      # Trusted publishing: npm authenticates with the OIDC token that
      # `id-token: write` grants and adds the provenance statement itself.
      - run: npm publish
